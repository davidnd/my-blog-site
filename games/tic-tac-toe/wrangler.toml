name = "tic-tac-toe"
main = "src/worker/index.ts"
compatibility_date = "2026-09-11"

# The Worker owns only the socket. The client is static and is served by Pages
# out of public/games/tic-tac-toe/, so a route claiming just this one path is
# enough, and it takes precedence over Pages on the same zone.
#
# Uncomment after `wrangler deploy` has created the Worker once:
# routes = [
#   { pattern = "davidnd.dev/games/tic-tac-toe/ws", zone_name = "davidnd.dev" }
# ]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyRoom"

# new_sqlite_classes, not new_classes: the SQLite storage backend is the only
# one available on the Workers free plan, and it is what makes storage reads
# synchronous inside the object.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "LobbyRoom"]

[observability]
enabled = true
