<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Big Fish Eat Small Fish">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a4a72"/>
      <stop offset="0.55" stop-color="#063a5c"/>
      <stop offset="1" stop-color="#04263f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#1f6f9e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1f6f9e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#water)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- bubbles -->
  <g fill="#cfeeff" opacity="0.28">
    <circle cx="70" cy="300" r="6"/>
    <circle cx="88" cy="268" r="4"/>
    <circle cx="330" cy="120" r="7"/>
    <circle cx="315" cy="86" r="4"/>
    <circle cx="352" cy="230" r="3.5"/>
    <circle cx="150" cy="70" r="4.5"/>
  </g>

  <!-- seabed -->
  <path d="M0 356 Q60 336 130 350 T270 348 T400 352 V400 H0 Z" fill="#2a2f22"/>
  <path d="M0 372 Q100 360 200 370 T400 368 V400 H0 Z" fill="#20241a"/>
  <!-- seaweed -->
  <g stroke="#3f8f5c" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M46 372 q-14 -26 4 -46 q-16 -20 2 -44"/>
    <path d="M360 374 q16 -24 -2 -46 q16 -18 0 -40"/>
  </g>
  <!-- starfish -->
  <path d="M300 366 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2 z" fill="#e0704f" opacity="0.9"/>

  <!-- small prey fish -->
  <g transform="translate(96 150)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#7ed6df"/>
    <path d="M18 0 L34 -12 L34 12 Z" fill="#7ed6df"/>
    <circle cx="-9" cy="-2" r="2.6" fill="#04263f"/>
  </g>

  <!-- player fish: orange goldfish facing right -->
  <g transform="translate(210 210)">
    <!-- tail -->
    <path d="M-58 0 C-92 -34 -96 34 -58 6 Z" fill="#f08a2e"/>
    <!-- dorsal + pelvic fins -->
    <path d="M-6 -34 C22 -44 30 -30 8 -22 Z" fill="#f7a94a"/>
    <path d="M-4 30 C14 44 26 34 12 22 Z" fill="#f7a94a"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="62" ry="40" fill="#ff9f43"/>
    <path d="M-62 0 A62 40 0 0 0 62 0 Z" fill="#ffbe6e" opacity="0.85"/>
    <!-- eye -->
    <circle cx="34" cy="-8" r="10" fill="#ffffff"/>
    <circle cx="37" cy="-8" r="5.2" fill="#1a2a1f"/>
    <circle cx="35" cy="-10" r="1.8" fill="#ffffff"/>
    <!-- smile -->
    <path d="M46 8 q10 6 18 1" stroke="#c96a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
