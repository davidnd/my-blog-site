<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tetris">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0d0d16"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" y="0" fill="#000" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <!-- faint grid -->
  <g stroke="#7a7adc" stroke-opacity="0.08" stroke-width="1">
    <path d="M50 0V400M100 0V400M150 0V400M200 0V400M250 0V400M300 0V400M350 0V400"/>
    <path d="M0 50H400M0 100H400M0 150H400M0 200H400M0 250H400M0 300H400M0 350H400"/>
  </g>

  <!-- settled stack at the bottom (muted classic palette) -->
  <g stroke="#0d0d16" stroke-width="3">
    <!-- bottom row -->
    <rect x="0"   y="350" width="50" height="50" fill="#7f96c9"/>
    <rect x="50"  y="350" width="50" height="50" fill="#7f96c9"/>
    <rect x="100" y="350" width="50" height="50" fill="#d5c36f"/>
    <rect x="150" y="350" width="50" height="50" fill="#d5c36f"/>
    <rect x="200" y="350" width="50" height="50" fill="#cd838b"/>
    <rect x="250" y="350" width="50" height="50" fill="#8fbf80"/>
    <rect x="300" y="350" width="50" height="50" fill="#6fc3cb"/>
    <rect x="350" y="350" width="50" height="50" fill="#6fc3cb"/>
    <!-- second row -->
    <rect x="0"   y="300" width="50" height="50" fill="#7f96c9"/>
    <rect x="100" y="300" width="50" height="50" fill="#d5c36f"/>
    <rect x="150" y="300" width="50" height="50" fill="#cd838b"/>
    <rect x="200" y="300" width="50" height="50" fill="#cd838b"/>
    <rect x="300" y="300" width="50" height="50" fill="#d9a06b"/>
    <rect x="350" y="300" width="50" height="50" fill="#6fc3cb"/>
    <!-- third row bits -->
    <rect x="150" y="250" width="50" height="50" fill="#8fbf80"/>
    <rect x="350" y="250" width="50" height="50" fill="#d9a06b"/>
  </g>

  <!-- bevel highlights on stack -->
  <g fill="#ffffff" opacity="0.22">
    <rect x="4" y="354" width="42" height="8"/><rect x="54" y="354" width="42" height="8"/>
    <rect x="104" y="354" width="42" height="8"/><rect x="154" y="354" width="42" height="8"/>
    <rect x="204" y="354" width="42" height="8"/><rect x="254" y="354" width="42" height="8"/>
    <rect x="304" y="354" width="42" height="8"/><rect x="354" y="354" width="42" height="8"/>
    <rect x="4" y="304" width="42" height="8"/><rect x="104" y="304" width="42" height="8"/>
    <rect x="154" y="304" width="42" height="8"/><rect x="204" y="304" width="42" height="8"/>
    <rect x="304" y="304" width="42" height="8"/><rect x="354" y="304" width="42" height="8"/>
    <rect x="154" y="254" width="42" height="8"/><rect x="354" y="254" width="42" height="8"/>
  </g>

  <!-- falling T piece with soft glow -->
  <g>
    <rect x="118" y="68" width="164" height="114" fill="#b18cc4" opacity="0.14" rx="14"/>
    <g stroke="#0d0d16" stroke-width="3">
      <rect x="180" y="80" width="50" height="50" fill="#b18cc4"/>
      <rect x="130" y="130" width="50" height="50" fill="#b18cc4"/>
      <rect x="180" y="130" width="50" height="50" fill="#b18cc4"/>
      <rect x="230" y="130" width="50" height="50" fill="#b18cc4"/>
    </g>
    <g fill="#ffffff" opacity="0.28">
      <rect x="184" y="84" width="42" height="8"/>
      <rect x="134" y="134" width="42" height="8"/>
      <rect x="184" y="134" width="42" height="8"/>
      <rect x="234" y="134" width="42" height="8"/>
    </g>
  </g>

  <!-- ghost landing hint -->
  <g fill="none" stroke="#b18cc4" stroke-width="3" opacity="0.35">
    <rect x="185" y="205" width="40" height="40"/>
    <rect x="135" y="255" width="40" height="40"/>
    <rect x="185" y="255" width="40" height="40"/>
    <rect x="235" y="255" width="40" height="40"/>
  </g>

  <!-- CRT scanlines -->
  <rect width="400" height="400" fill="url(#scan)"/>
</svg>
