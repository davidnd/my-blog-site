<svg viewBox="0 0 1200 772" xmlns="http://www.w3.org/2000/svg" font-family="Source Serif 4, Georgia, Cambria, Times New Roman, Times, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="772" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Charge path: one atomic reservation, one network call, then a single transaction</text>
  <line x1="150" y1="100" x2="150" y2="712" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="70" y="60" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Merchant</text>
  <rect x="70" y="712" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150" y="737" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Merchant</text>
  <line x1="470" y1="100" x2="470" y2="712" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="390" y="60" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="470" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Charge Service</text>
  <rect x="390" y="712" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="470" y="737" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Charge Service</text>
  <line x1="770" y1="100" x2="770" y2="712" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="690" y="60" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="770" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Postgres</text>
  <rect x="690" y="712" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="770" y="737" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Postgres</text>
  <line x1="1060" y1="100" x2="1060" y2="712" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 5"/>
  <rect x="980" y="60" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="1060" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Card Network</text>
  <rect x="980" y="712" width="160" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="1060" y="737" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Card Network</text>
  <line x1="150" y1="132" x2="470" y2="132" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="310" y="125" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">POST /charges (idempotency_key)</text>
  <line x1="470" y1="170" x2="770" y2="170" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="163" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1e293b">INSERT idempotency ON CONFLICT (status = pending)</text>
  <rect x="104" y="192" width="1040" height="504" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <path d="M 104 192 h 46 v 14 l -8 8 h -38 z" fill="#4f46e5"/>
  <text x="125" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">alt</text>
  <text x="174" y="208" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">key already reserved</text>
  <line x1="770" y1="242" x2="470" y2="242" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="620" y="235" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">conflict</text>
  <line x1="470" y1="280" x2="150" y2="280" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="310" y="273" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">cached result or 409</text>
  <line x1="104" y1="308" x2="1144" y2="308" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="624" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">else  first writer</text>
  <line x1="470" y1="348" x2="1060" y2="348" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="765" y="341" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">authorize / capture</text>
  <rect x="124" y="372" width="1000" height="304" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <path d="M 124 372 h 46 v 14 l -8 8 h -38 z" fill="#4f46e5"/>
  <text x="145" y="388" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">alt</text>
  <text x="194" y="388" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">response received</text>
  <line x1="1060" y1="424" x2="470" y2="424" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="765" y="417" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">ok or decline</text>
  <line x1="470" y1="462" x2="770" y2="462" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="455" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1e293b">ONE tx: ledger + charge + idempotency + outbox</text>
  <line x1="470" y1="500" x2="150" y2="500" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="310" y="493" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">200 result</text>
  <line x1="124" y1="528" x2="1124" y2="528" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="6 5"/>
  <text x="624" y="523" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">else  timeout (in-doubt)</text>
  <line x1="470" y1="566" x2="150" y2="566" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="310" y="559" text-anchor="middle" font-size="12" font-weight="400" fill="#1e293b">202 pending</text>
  <rect x="470" y="596" width="654" height="64" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="797" y="622" text-anchor="middle" font-size="12.5" font-weight="400" fill="#92400e">reaper retries an inquiry (same idempotency token),</text>
  <text x="797" y="642" text-anchor="middle" font-size="12.5" font-weight="400" fill="#92400e">reconciliation backstops, webhook fires on the terminal outcome</text>
</svg>
