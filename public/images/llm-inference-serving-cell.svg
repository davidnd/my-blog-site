<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.6,1.4 L9.5,5.5 L1.6,9.6 Z" fill="#273142"/>
    </marker>
    <marker id="arrowTeal" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.6,1.4 L9.5,5.5 L1.6,9.6 Z" fill="#047481"/>
    </marker>
    <marker id="arrowAmber" markerWidth="11" markerHeight="11" refX="9.5" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.6,1.4 L9.5,5.5 L1.6,9.6 Z" fill="#a15c00"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .outer { fill: #ffffff; stroke: #b8bcc5; stroke-width: 3; }
      .cell { fill: #ffffff; stroke: #9ca3af; stroke-width: 3; }
      .box { fill: #f8fafc; stroke: #273142; stroke-width: 3; }
      .blue { fill: #eef4ff; }
      .cream { fill: #fff6ec; }
      .green { fill: #eefbf5; }
      .inner { fill: #ffffff; stroke: #273142; stroke-width: 2.4; }
      .standby { fill: #ffffff; stroke: #273142; stroke-width: 2.4; stroke-dasharray: 9 8; }
      .cold { fill: #ffffff; stroke: #273142; stroke-width: 2.4; stroke-dasharray: 3 8; }
      .request { fill: none; stroke: #273142; stroke-width: 2.6; marker-end: url(#arrow); }
      .stream { fill: none; stroke: #047481; stroke-width: 2.6; marker-end: url(#arrowTeal); }
      .control { fill: none; stroke: #a15c00; stroke-width: 2.2; stroke-dasharray: 9 8; marker-end: url(#arrowAmber); }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 800; }
      .section { font-size: 28px; font-weight: 800; }
      .h { font-size: 21px; font-weight: 800; }
      .body { font-size: 17px; fill: #5f6673; }
      .small { font-size: 15px; fill: #5f6673; }
      .label { font-size: 15px; font-weight: 700; fill: #4b5563; }
      .label-bg { fill: #ffffff; opacity: 0.96; }
      .note { font-size: 16px; fill: #4b5563; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="950"/>
  <rect class="outer" x="38" y="28" width="1524" height="880" rx="30"/>

  <text class="text title" x="800" y="76" text-anchor="middle">Multi-tenant LLM inference serving platform</text>

  <!-- Top-level request router and control plane -->
  <rect class="box" x="82" y="120" width="250" height="95" rx="18"/>
  <text class="text h" x="207" y="158" text-anchor="middle">Clients</text>
  <text class="text body" x="207" y="188" text-anchor="middle">HTTP streaming requests</text>

  <rect class="box blue" x="395" y="108" width="330" height="120" rx="18"/>
  <text class="text h" x="560" y="149" text-anchor="middle">Global traffic director</text>
  <text class="text body" x="560" y="179" text-anchor="middle">routes new admissions by</text>
  <text class="text body" x="560" y="204" text-anchor="middle">model, tenant tier, cell capacity</text>

  <rect class="box cream" x="1115" y="108" width="365" height="120" rx="18"/>
  <text class="text h" x="1297.5" y="149" text-anchor="middle">Capacity controller</text>
  <text class="text body" x="1297.5" y="179" text-anchor="middle">forecasts per model &#215; cell:</text>
  <text class="text body" x="1297.5" y="204" text-anchor="middle">standby promotion, cold starts</text>

  <path class="request" d="M332 167.5 H383"/>
  <rect class="label-bg" x="326" y="128" width="62" height="22" rx="6"/>
  <text class="text label" x="357" y="144" text-anchor="middle">request</text>

  <path class="control" d="M1115 152 H738"/>
  <rect class="label-bg" x="807" y="112" width="242" height="24" rx="6"/>
  <text class="text label" x="928" y="130" text-anchor="middle">capacity map + admission policy</text>
  <path class="control" d="M725 200 H1103"/>
  <rect class="label-bg" x="798" y="226" width="234" height="24" rx="6"/>
  <text class="text label" x="915" y="244" text-anchor="middle">demand signals + load telemetry</text>

  <!-- Serving cell -->
  <rect class="cell" x="78" y="284" width="1444" height="565" rx="28"/>
  <text class="text section" x="800" y="330" text-anchor="middle">Serving cell</text>

  <rect class="box green" x="120" y="382" width="275" height="130" rx="18"/>
  <text class="text h" x="257.5" y="423" text-anchor="middle">Streaming nodes</text>
  <text class="text body" x="257.5" y="454" text-anchor="middle">cell ingress/egress</text>
  <text class="text body" x="257.5" y="480" text-anchor="middle">bounded buffers, stream errors</text>

  <rect class="box" x="462" y="382" width="250" height="130" rx="18"/>
  <text class="text h" x="587" y="423" text-anchor="middle">Cell admission</text>
  <text class="text body" x="587" y="454" text-anchor="middle">rate limits, SLA guard</text>
  <text class="text body" x="587" y="480" text-anchor="middle">overload shedding</text>

  <rect class="box blue" x="780" y="382" width="270" height="130" rx="18"/>
  <text class="text h" x="915" y="423" text-anchor="middle">Model router + schedulers</text>
  <text class="text body" x="915" y="454" text-anchor="middle">selects instant or thinking lane</text>
  <text class="text body" x="915" y="480" text-anchor="middle">replica placement, priority</text>

  <rect class="box blue" x="1140" y="318" width="300" height="280" rx="18"/>
  <text class="text h" x="1290" y="357" text-anchor="middle">Instant model pool</text>
  <text class="text body" x="1290" y="385" text-anchor="middle">same resident weights, free + paid</text>
  <rect class="inner" x="1180" y="406" width="220" height="38" rx="10"/>
  <text class="text small" x="1290" y="431" text-anchor="middle">Free floor</text>
  <rect class="inner" x="1180" y="456" width="220" height="38" rx="10"/>
  <text class="text small" x="1290" y="481" text-anchor="middle">Paid instant floor</text>
  <rect class="inner" x="1180" y="506" width="220" height="38" rx="10"/>
  <text class="text small" x="1290" y="531" text-anchor="middle">Shared burst (free + paid)</text>
  <rect class="standby" x="1180" y="556" width="220" height="38" rx="10"/>
  <text class="text small" x="1290" y="581" text-anchor="middle">Warm standby</text>

  <rect class="box blue" x="1140" y="638" width="300" height="190" rx="18"/>
  <text class="text h" x="1290" y="677" text-anchor="middle">Thinking model pool</text>
  <text class="text body" x="1290" y="705" text-anchor="middle">paid higher-compute lane</text>
  <rect class="inner" x="1180" y="728" width="220" height="32" rx="9"/>
  <text class="text small" x="1290" y="750" text-anchor="middle">Paid thinking active</text>
  <rect class="standby" x="1180" y="772" width="220" height="32" rx="9"/>
  <text class="text small" x="1290" y="794" text-anchor="middle">Thinking warm standby</text>
  <rect class="cold" x="1180" y="816" width="220" height="32" rx="9"/>
  <text class="text small" x="1290" y="838" text-anchor="middle">Cold-start capacity</text>

  <!-- Request path -->
  <path class="request" d="M560 228 V265 H257.5 V370"/>
  <rect class="label-bg" x="352" y="238" width="116" height="24" rx="6"/>
  <text class="text label" x="410" y="256" text-anchor="middle">new admission</text>
  <path class="request" d="M395 447 H450"/>
  <path class="request" d="M712 447 H768"/>
  <path class="request" d="M1050 424 H1128"/>
  <path class="request" d="M1050 480 H1104 V733 H1128"/>
  <rect class="label-bg" x="1062" y="386" width="64" height="24" rx="6"/>
  <text class="text label" x="1094" y="404" text-anchor="middle">instant</text>
  <rect class="label-bg" x="1030" y="696" width="76" height="24" rx="6"/>
  <text class="text label" x="1068" y="714" text-anchor="middle">thinking</text>

  <!-- Token return path -->
  <path class="stream" d="M1290 598 V615 H1118 V842 H257.5 V512"/>
  <path class="stream" d="M1140 752 H1118"/>
  <rect class="label-bg" x="466" y="856" width="398" height="24" rx="6"/>
  <text class="text label" x="665" y="874" text-anchor="middle" fill="#047481">token stream return path: bounded, no durable queue</text>
  <path class="stream" d="M120 447 H62 V167.5 H70"/>
  <rect class="label-bg" x="-451" y="84" width="236" height="24" rx="6" transform="rotate(-90)"/>
  <text class="text label" x="96" y="333" transform="rotate(-90 96 333)" fill="#047481">stream response on same connection</text>

  <!-- Autoscaling control into the cell -->
  <rect class="label-bg" x="1242" y="252" width="154" height="24" rx="6"/>
  <text class="text label" x="1319" y="270" text-anchor="middle">autoscaling actions</text>
  <path class="control" d="M1266 228 V318"/>
  <path class="control" d="M1368 228 V276 H1490 V733 H1440"/>

  <!-- Legend and notes -->
  <rect class="inner" x="585" y="704" width="360" height="74" rx="14"/>
  <path class="request" d="M610 730 H680"/>
  <text class="text small" x="695" y="735">request admission path</text>
  <path class="stream" d="M610 758 H680"/>
  <text class="text small" x="695" y="763">token stream return path</text>

  <text class="text note" x="800" y="890" text-anchor="middle">
    Instant and thinking capacity are non-fungible without a weight swap; control traffic is separated from request and token-stream paths.
  </text>
</svg>
