<svg viewBox="0 0 1280 860" xmlns="http://www.w3.org/2000/svg" font-family="Source Serif 4, Georgia, Cambria, Times New Roman, Times, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrowControl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="860" fill="#ffffff"/>
  <text x="640" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Multi-Tenant LLM Inference Platform: Serving Cell</text>
  <text x="640" y="62" text-anchor="middle" font-size="13" fill="#64748b">Request path (solid), token stream (dashed green), control plane (dashed amber). Spare capacity is model-local.</text>

  <!-- Clients -->
  <rect x="60" y="104" width="120" height="72" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="120" y="136" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Clients</text>
  <text x="120" y="158" text-anchor="middle" font-size="11.5" fill="#64748b">HTTP streaming</text>

  <!-- Global traffic director -->
  <rect x="248" y="94" width="212" height="92" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="354" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Global Traffic Director</text>
  <text x="354" y="144" text-anchor="middle" font-size="12" fill="#64748b">routes new admissions by</text>
  <text x="354" y="162" text-anchor="middle" font-size="12" fill="#64748b">model, tier, cell capacity</text>

  <!-- Capacity controller -->
  <rect x="920" y="94" width="250" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1045" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Capacity Controller</text>
  <text x="1045" y="144" text-anchor="middle" font-size="12" fill="#7c2d12">forecasts demand per model x cell</text>
  <text x="1045" y="162" text-anchor="middle" font-size="12" fill="#7c2d12">standby promotion, cold starts</text>

  <!-- Clients -> Director -->
  <line x1="182" y1="140" x2="246" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="214" y="128" text-anchor="middle" font-size="11.5" fill="#64748b">request</text>

  <!-- Controller <-> Director (control plane) -->
  <line x1="918" y1="118" x2="464" y2="118" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowControl)"/>
  <text x="691" y="106" text-anchor="middle" font-size="11.5" fill="#9a3412">capacity map + admission policy</text>
  <line x1="462" y1="166" x2="916" y2="166" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowControl)"/>
  <text x="691" y="186" text-anchor="middle" font-size="11.5" fill="#9a3412">demand signals + load telemetry</text>

  <!-- Serving cell -->
  <rect x="60" y="246" width="1160" height="556" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="84" y="278" font-size="15" font-weight="700" fill="#334155">Serving Cell</text>
  <text x="84" y="296" font-size="11.5" fill="#64748b">failure + routing domain</text>

  <!-- Streaming nodes -->
  <rect x="100" y="360" width="200" height="112" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="200" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Streaming Nodes</text>
  <text x="200" y="414" text-anchor="middle" font-size="12" fill="#64748b">cell ingress / egress</text>
  <text x="200" y="432" text-anchor="middle" font-size="12" fill="#64748b">bounded buffers</text>
  <text x="200" y="450" text-anchor="middle" font-size="12" fill="#64748b">stream error handling</text>

  <!-- Cell admission -->
  <rect x="372" y="360" width="190" height="112" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="467" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Cell Admission</text>
  <text x="467" y="420" text-anchor="middle" font-size="12" fill="#64748b">rate limits, SLA guard</text>
  <text x="467" y="438" text-anchor="middle" font-size="12" fill="#64748b">overload shedding</text>

  <!-- Model router -->
  <rect x="624" y="360" width="200" height="112" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="724" y="392" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Model Router + Scheduler</text>
  <text x="724" y="416" text-anchor="middle" font-size="12" fill="#64748b">picks instant / thinking lane</text>
  <text x="724" y="434" text-anchor="middle" font-size="12" fill="#64748b">replica placement, priority</text>

  <!-- Model-local GPU pools -->
  <rect x="870" y="300" width="330" height="478" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="1035" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Model-Local GPU Pools</text>

  <!-- Instant pool -->
  <rect x="894" y="346" width="282" height="212" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="1035" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Instant Model</text>
  <text x="1035" y="390" text-anchor="middle" font-size="11.5" fill="#64748b">free + paid tiers, resident weights</text>
  <rect x="916" y="404" width="238" height="28" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1035" y="422" text-anchor="middle" font-size="12" fill="#1e293b">Free floor</text>
  <rect x="916" y="440" width="238" height="28" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1035" y="458" text-anchor="middle" font-size="12" fill="#1e293b">Paid instant floor</text>
  <rect x="916" y="476" width="238" height="28" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1035" y="494" text-anchor="middle" font-size="12" fill="#1e293b">Shared burst (free + paid)</text>
  <rect x="916" y="512" width="238" height="28" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1035" y="530" text-anchor="middle" font-size="12" fill="#1e293b">Warm standby</text>

  <!-- Thinking pool -->
  <rect x="894" y="580" width="282" height="176" rx="10" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="1035" y="606" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">Thinking Model</text>
  <text x="1035" y="624" text-anchor="middle" font-size="11.5" fill="#64748b">paid only, higher-compute lane</text>
  <rect x="916" y="638" width="238" height="28" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1035" y="656" text-anchor="middle" font-size="12" fill="#1e293b">Paid thinking active</text>
  <rect x="916" y="674" width="238" height="28" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="1035" y="692" text-anchor="middle" font-size="12" fill="#1e293b">Thinking warm standby</text>
  <rect x="916" y="710" width="238" height="28" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.4" stroke-dasharray="2 5"/>
  <text x="1035" y="728" text-anchor="middle" font-size="12" fill="#1e293b">Cold-start capacity</text>

  <text x="1035" y="771" text-anchor="middle" font-size="11" font-style="italic" fill="#4338ca">non-fungible without a weight swap</text>

  <!-- REQUEST PATH (solid) -->
  <!-- Director -> Streaming nodes -->
  <path d="M 340 188 C 320 260, 250 310, 200 358" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="294" y="284" font-size="11.5" fill="#64748b">new admissions</text>
  <!-- Streaming -> Admission -->
  <line x1="302" y1="416" x2="370" y2="416" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Admission -> Router -->
  <line x1="564" y1="416" x2="622" y2="416" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- Router -> Instant pool -->
  <line x1="826" y1="400" x2="866" y2="400" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="846" y="390" text-anchor="middle" font-size="11.5" fill="#64748b">instant</text>
  <!-- Router -> Thinking pool -->
  <path d="M 760 474 C 800 540, 805 620, 866 658" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="793" y="570" text-anchor="end" font-size="11.5" fill="#64748b">thinking</text>

  <!-- TOKEN STREAM (dashed green) -->
  <!-- Pools -> Streaming nodes -->
  <path d="M 868 730 C 640 800, 300 640, 205 478" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowReturn)"/>
  <text x="520" y="772" text-anchor="middle" font-size="11.5" fill="#047857">tokens pushed direct to streaming nodes, no durable queue</text>
  <!-- Streaming nodes -> Clients -->
  <path d="M 98 400 C 50 340, 60 240, 105 178" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowReturn)"/>
  <text x="92" y="326" font-size="11.5" fill="#047857">stream tokens</text>

  <!-- CONTROL: Controller -> Pools -->
  <line x1="1045" y1="188" x2="1045" y2="297" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowControl)"/>
  <text x="1054" y="226" font-size="11.5" fill="#9a3412">autoscaling actions</text>

  <!-- Legend -->
  <line x1="60" y1="832" x2="100" y2="832" stroke="#475569" stroke-width="1.8"/>
  <text x="108" y="836" font-size="12" fill="#475569">request path</text>
  <line x1="240" y1="832" x2="280" y2="832" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="288" y="836" font-size="12" fill="#047857">token stream (latency-critical, direct)</text>
  <line x1="560" y1="832" x2="600" y2="832" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="608" y="836" font-size="12" fill="#9a3412">control plane (forecasts, autoscaling)</text>
  <rect x="868" y="824" width="40" height="16" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="918" y="836" font-size="12" fill="#475569">standby / cold capacity (no traffic)</text>
</svg>
